name: Mobile Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-android:
    name: Testes Android - BrowserStack
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes no BrowserStack
        env:
          BROWSERSTACK_USER: ${{ secrets.BROWSERSTACK_USER }}
          BROWSERSTACK_KEY: ${{ secrets.BROWSERSTACK_KEY }}
          BROWSERSTACK_APP_URL: ${{ secrets.BROWSERSTACK_APP_URL }}
        run: npm run test:browserstack

      - name: Gerar relatório Allure
        if: always()
        run: npx allure generate allure-results --clean -o allure-report
      
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload artifact para Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-android
          path: allure-report/

      - name: Salvar screenshots como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: test/screenshots/
          if-no-files-found: ignore
